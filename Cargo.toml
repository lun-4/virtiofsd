[package]
name = "virtiofsd"
description = "A virtio-fs vhost-user device daemon"
version = "1.13.3"
authors = ["The Virtiofs Project Developers"]
edition = "2018"
homepage = "https://virtio-fs.gitlab.io/"
repository = "https://gitlab.com/virtio-fs/virtiofsd"
license = "Apache-2.0 AND BSD-3-Clause"
readme = "README.md"

exclude = [".gitlab-ci.yml"]

[features]
default = ["seccomp"]
# Expose seccomp bindings from the library.
seccomp = ["dep:libseccomp-sys"]
# Enabling Xen support will _disable_ QEMU/KVM support!
xen = ["vhost-user-backend/xen", "vhost/xen", "vm-memory/xen"]
# Enable HTTP control plane for dynamic share management
http-control = ["dep:tokio", "dep:axum", "dep:tower-http"]

[[bin]]
name = "virtiofsd"
required-features = ["seccomp"]

[dependencies]
bitflags = "1.2"
btree-range-map = "0.7"
capng = "0.2.2"
env_logger = "0.8.4"
futures = { version = "0.3", features = ["thread-pool"] }
libc = "0.2.177"
log = "0.4"
libseccomp-sys = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive", "env"] }
postcard = { version = "1.0", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vhost-user-backend = "0.17.0"
vhost = "0.13.0"
virtio-bindings = "0.2.1"
vm-memory = { version = "0.16.0", features = ["backend-mmap", "backend-atomic"] }
virtio-queue = "0.14.0"
vmm-sys-util = "0.12.1"
syslog = "6.1"

# HTTP control plane dependencies (optional)
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"], optional = true }
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

[profile.release]
lto = true
